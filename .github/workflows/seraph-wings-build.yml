name: Seraph Wings Fabric 1.21.11 Build
on:
  push:
    branches: [build/seraph-wings-fabric-1-21-11-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Build real remapped Minecraft 1.21.11 Fabric JAR
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload built mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: seraph-wings-1.0.2
          path: build/libs/seraph-wings-1.0.2.jar
          if-no-files-found: error
